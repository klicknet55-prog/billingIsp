openapi: 3.0.3
info:
  title: NetManage ISP REST API v1
  version: 1.0.0
  description: Read-only tenant API. Authenticate with Bearer API key from /dashboard/integrasi.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /pelanggan:
    get:
      summary: List pelanggan
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [active, isolated] }
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Paginated pelanggan list
  /pelanggan/{id}:
    get:
      summary: Pelanggan detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pelanggan detail
        "404":
          description: Not found
  /tagihan:
    get:
      summary: List tagihan
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: pelangganId
          schema: { type: string }
        - in: query
          name: periode
          schema: { type: string }
      responses:
        "200":
          description: Paginated tagihan list
  /invoice:
    get:
      summary: List invoice (nota legacy)
      responses:
        "200":
          description: Paginated invoice list
  /router:
    get:
      summary: List routers (credentials masked)
      responses:
        "200":
          description: Router list
  /router/{id}/status:
    get:
      summary: Live router status via Mikrotik
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Router online status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
